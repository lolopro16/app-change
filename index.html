<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Change</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #101418;
    --card: #1b2127;
    --card-active: #243039;
    --key: #1b2127;
    --key-press: #2a333c;
    --text: #eef2f5;
    --muted: #8b98a5;
    --accent: #4fc3a1;
    --error: #ff7a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
    user-select: none;
  }
  button { font: inherit; color: inherit; }

  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
  #status { color: var(--muted); font-size: .75rem; }
  #status.err { color: var(--error); }
  #refresh {
    background: none; border: 1px solid #2c353e;
    border-radius: 999px; padding: 6px 12px; font-size: .85rem;
  }
  #refresh:active { background: var(--card); }

  /* Taux de change */
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 14px; padding: 10px 14px;
    border: 1px solid transparent; width: 100%; text-align: left;
  }
  .row.src { background: var(--card-active); border-color: var(--accent); }
  .flag { font-size: 1.5rem; line-height: 1; }
  .meta { flex: 1; min-width: 0; }
  .code { font-weight: 600; font-size: .95rem; }
  .sub { color: var(--muted); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val {
    font-size: 1.25rem; font-weight: 600; text-align: right;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }

  /* Saisie */
  .input-wrap { background: var(--card); border-radius: 16px; padding: 10px 14px 12px; }
  .amount-line { display: flex; align-items: baseline; gap: 8px; }
  #amount {
    flex: 1; min-width: 0; text-align: right;
    font-size: 2.2rem; font-weight: 600; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; direction: rtl;
  }
  #amount span { direction: ltr; unicode-bidi: isolate; }
  #clear {
    align-self: center; background: #141a1f; border: 1px solid #2c353e;
    border-radius: 999px; width: 40px; height: 40px; color: var(--accent); font-weight: 600;
  }
  #clear:active { background: var(--key-press); }
  #amount-cur { color: var(--accent); font-weight: 600; font-size: 1.1rem; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .seg button {
    background: #141a1f; color: var(--muted); border: 1px solid #2c353e;
    border-radius: 10px; padding: 8px 0; font-size: .95rem; font-weight: 600;
  }
  .seg button.on { background: var(--accent); color: #0b1a15; border-color: var(--accent); }

  /* Pavé numérique */
  .keypad {
    flex: 1; min-height: 220px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 8px;
  }
  .keypad button {
    background: var(--key); border: none; border-radius: 14px;
    font-size: 1.6rem; font-weight: 500;
  }
  .keypad button:active { background: var(--key-press); }
  .keypad .fn { color: var(--accent); font-size: 1.3rem; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Change</h1>
      <div id="status">Chargement des taux…</div>
    </div>
    <button id="refresh" type="button">↻ Actualiser</button>
  </header>

  <div class="rows" id="rows"></div>

  <div class="input-wrap">
    <div class="amount-line">
      <button type="button" id="clear" aria-label="Remettre à zéro">C</button>
      <div id="amount"><span>1</span></div>
      <div id="amount-cur">EUR</div>
    </div>
    <div class="seg" id="seg">
      <button type="button" data-cur="EUR">EUR</button>
      <button type="button" data-cur="USD">USD</button>
      <button type="button" data-cur="PYG">PYG</button>
      <button type="button" data-cur="CHF">CHF</button>
    </div>
  </div>

  <div class="keypad" id="keypad">
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="." class="fn">.</button>
    <button type="button" data-k="0">0</button>
    <button type="button" data-k="del" class="fn" aria-label="Effacer">⌫</button>
  </div>

<script>
const CURRENCIES = {
  EUR: { flag: "🇪🇺", name: "Euro", decimals: 2 },
  USD: { flag: "🇺🇸", name: "Dollar américain", decimals: 2 },
  PYG: { flag: "🇵🇾", name: "Guaraní paraguayen", decimals: 0 },
  CHF: { flag: "🇨🇭", name: "Franc suisse", decimals: 2 },
};
const CACHE_KEY = "rates-v3";
const REFRESH_MS = 60 * 60 * 1000; // actualisation automatique toutes les heures
const TIMEOUT_MS = 8000;

// Sources essayées dans l'ordre ; chacune renvoie { rates, updatedAt }
// avec rates = valeur de 1 EUR dans chaque devise.
const SOURCES = [
  {
    name: "Coinbase",
    url: "https://api.coinbase.com/v2/exchange-rates?currency=EUR",
    parse: j => ({ rates: pick(j.data.rates), updatedAt: Date.now() }), // pas d'horodatage fourni
  },
  {
    name: "open.er-api.com",
    url: "https://open.er-api.com/v6/latest/EUR",
    parse: j => {
      if (j.result !== "success") throw new Error("réponse invalide");
      return { rates: pick(j.rates), updatedAt: j.time_last_update_unix * 1000 };
    },
  },
];
const PREF_KEY = "source-cur";
const MAX_INT_DIGITS = 12;

// rates : valeur de 1 EUR dans chaque devise
let rates = null;
let updatedAt = null;
let sourceName = null;
let source = load(PREF_KEY) || "EUR";
// Montant saisi, sous forme de texte : chiffres + éventuel point décimal
let amount = "1";

const $amount = document.getElementById("amount");
const $amountCur = document.getElementById("amount-cur");
const $rows = document.getElementById("rows");
const $status = document.getElementById("status");
const $seg = document.getElementById("seg");

function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function save(key, v) { try { localStorage.setItem(key, v); } catch {} }

// Format suisse : 1'500'000.00 (apostrophe pour les milliers, point décimal)
function swiss(n, opts) {
  return new Intl.NumberFormat("en-US", opts).format(n).replace(/,/g, "'");
}

function fmt(n, cur) {
  const d = CURRENCIES[cur].decimals;
  return swiss(n, { minimumFractionDigits: d, maximumFractionDigits: d });
}

// Taux unitaire lisible : 6 690 / 1,1344 / 0,0001495
function fmtRate(n) {
  const opts = n >= 100 ? { maximumFractionDigits: 0 } : { maximumSignificantDigits: 5 };
  return swiss(n, opts);
}

function amountValue() {
  const n = parseFloat(amount);
  return Number.isFinite(n) ? n : 0;
}

function amountDisplay() {
  const [int, dec] = amount.split(".");
  const grouped = swiss(Number(int || "0"));
  return dec === undefined ? grouped : grouped + "." + dec;
}

function press(k) {
  const [int, dec] = amount.split(".");
  if (k === "C") amount = "0";
  else if (k === "del") amount = amount.length > 1 ? amount.slice(0, -1) : "0";
  else if (k === ".") {
    if (dec === undefined && CURRENCIES[source].decimals > 0) amount += ".";
  } else if (dec !== undefined) {
    if (dec.length < CURRENCIES[source].decimals) amount += k;
  } else if (int.length < MAX_INT_DIGITS) {
    amount = amount === "0" ? k : amount + k;
  }
  render();
}

function setSource(cur) {
  source = cur;
  save(PREF_KEY, cur);
  // Le guaraní n'a pas de décimales
  if (CURRENCIES[cur].decimals === 0) amount = amount.split(".")[0] || "0";
  render();
}

function render() {
  $seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.cur === source));
  $amount.firstElementChild.textContent = amountDisplay();
  $amountCur.textContent = source;
  if (!rates) { $rows.innerHTML = ""; return; }

  const inEur = amountValue() / rates[source];
  $rows.innerHTML = Object.keys(CURRENCIES).map(cur => {
    const c = CURRENCIES[cur];
    const sub = cur === source
      ? c.name
      : `1 ${source} = ${fmtRate(rates[cur] / rates[source])} ${cur}`;
    return `<button type="button" class="row${cur === source ? " src" : ""}" data-cur="${cur}">
      <span class="flag">${c.flag}</span>
      <div class="meta"><div class="code">${cur}</div><div class="sub">${sub}</div></div>
      <div class="val">${fmt(inEur * rates[cur], cur)}</div>
    </button>`;
  }).join("");
}

// Extrait nos devises d'une table de taux (valeurs parfois en texte) et vérifie qu'elles sont toutes là
function pick(table) {
  const r = { EUR: 1 };
  for (const cur of Object.keys(CURRENCIES)) {
    if (cur === "EUR") continue;
    const v = Number(table[cur]);
    if (!(v > 0)) throw new Error("taux manquant : " + cur);
    r[cur] = v;
  }
  return r;
}

function showStatus(suffix = "") {
  if (!updatedAt) return;
  const d = new Date(updatedAt);
  const sameDay = d.toDateString() === new Date().toDateString();
  const when = sameDay
    ? "aujourd'hui " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
  $status.className = "";
  $status.textContent = `Taux ${sourceName ? sourceName + " · " : ""}${when}${suffix}`;
}

async function fetchJson(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(t);
  }
}

let fetching = false;
let lastFetch = 0;

async function fetchRates() {
  if (fetching) return;
  fetching = true;
  $status.className = "";
  $status.textContent = "Actualisation…";
  try {
    for (const src of SOURCES) {
      try {
        const r = src.parse(await fetchJson(src.url));
        rates = r.rates;
        updatedAt = r.updatedAt;
        sourceName = src.name;
        lastFetch = Date.now();
        save(CACHE_KEY, JSON.stringify({ rates, updatedAt, sourceName }));
        render();
        showStatus();
        return;
      } catch (e) {
        console.warn(src.name, "indisponible :", e);
      }
    }
    if (rates) {
      showStatus(" — hors ligne");
    } else {
      $status.className = "err";
      $status.textContent = "Impossible de charger les taux. Vérifiez la connexion.";
    }
  } finally {
    fetching = false;
  }
}

document.getElementById("keypad").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k;
  if (k) press(k);
});
$seg.addEventListener("click", e => {
  const cur = e.target.dataset && e.target.dataset.cur;
  if (cur) setSource(cur);
});
// Toucher une ligne la prend comme devise de départ
$rows.addEventListener("click", e => {
  const cur = e.target.closest(".row")?.dataset.cur;
  if (cur) setSource(cur);
});
document.getElementById("clear").addEventListener("click", () => press("C"));
document.getElementById("refresh").addEventListener("click", fetchRates);

// Démarrage : afficher le cache immédiatement, puis actualiser
try {
  const cached = JSON.parse(load(CACHE_KEY));
  if (cached) { rates = cached.rates; updatedAt = cached.updatedAt; sourceName = cached.sourceName; showStatus(); }
} catch {}
render();
fetchRates();

// Toutes les heures tant que l'app est affichée…
setInterval(() => { if (!document.hidden) fetchRates(); }, REFRESH_MS);
// …et à chaque retour dans l'app (Android la garde souvent en mémoire au lieu de la relancer)
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastFetch > 60 * 1000) fetchRates();
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
